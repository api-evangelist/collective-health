name: Collective Health
description: 'Collective Health is an independent third-party administrator (TPA) for
  self-funded employer health benefits, combining plan administration, claims adjudication,
  payments, care navigation, and member advocacy into a single connected benefits
  experience. Its Collective TPA platform, member app (My Collective), Benefits Hub
  partner ecosystem, and Collective AI tools serve employers, benefits leaders, brokers,
  consultants, and members. The company integrates with network and digital point-solution
  partners via enrollment file sharing, outbound claims data feeds, and payments,
  and is HITRUST r2 and SOC 2 Type II certified. It currently publishes no public
  developer API program; this profile tracks its identity, trust, and security posture
  in the API Evangelist network.'
